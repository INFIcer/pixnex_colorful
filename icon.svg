<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <!-- 提取原图三种颜色：灰蓝、灰褐、奶油黄 -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5dc3eb" />
      <stop offset="50%" stop-color="#c3e48f" />
      <stop offset="100%" stop-color="#eeec6b" />
    </linearGradient>

    <!-- 纯净的模糊滤镜，用于制作阴影 -->
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <mask id="cutout-mask">
      <rect x="0" y="0" width="200" height="200" fill="white" />
      <circle cx="100" cy="100" r="60" fill="none" stroke="#000000" stroke-width="30" />
      <circle cx="100" cy="100" r="30" fill="#000000" stroke="none" stroke-width="10" />
      <rect transform="matrix(1,-0.1,0.1,1,-4.9,11.4)" x="50.3" y="98" width="14.8" height="100" fill="#ffffff" />

    </mask>
    <mask id="cutout-mask2">
      <rect x="0" y="0" width="200" height="200" fill="#000000" />
      <circle cx="100" cy="100" r="60" fill="none" stroke="#ffffff" stroke-width="30" />
      <circle cx="100" cy="100" r="30" fill="#ffffff" stroke="none" stroke-width="10" />
      <rect transform="matrix(1,-0.1,0.1,1,-4.9,11.4)" x="50.3" y="98" width="14.8" height="100" fill="#000000" />

    </mask>
  </defs>

  <!-- 背景底框 -->
  <rect width="200" height="200" fill="#ffffff" rx="50" />
   
  <rect width="200" height="200" fill="#50cad3" mask="url(#cutout-mask2)" />
</svg>